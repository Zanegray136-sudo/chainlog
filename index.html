<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChainLog</title>
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1014;--panel:#161920;--panel2:#1c2029;--line:#262b36;--line2:#323846;
  --text:#e6e8ee;--muted:#8b93a7;--accent:#33c7b8;--accent-ink:#04201d;
  --ok:#3ecf8e;--warn:#f5a524;--bad:#ff5d5d;--info:#5aa9ff;--grey:#6b7385;
  --r:10px;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);font-size:13px}
.ic{width:18px;height:18px;flex:none}
.center{display:grid;place-items:center;min-height:60vh}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#47506a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:0;background:transparent;color:var(--text);cursor:pointer}
.icon-btn:hover{background:var(--panel2)}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field{margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* layout */
.demo-bar{background:#2a2110;color:#f7cf86;font-size:12px;padding:7px 16px;text-align:center;border-bottom:1px solid #3d3016}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;padding:4px 8px 18px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand .logo .ic{width:17px;height:17px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;margin-bottom:2px}
.nav-i:hover{background:var(--panel2);color:var(--text)}
.nav-i.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.badge{margin-left:auto;font-style:normal;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.me{padding:4px 8px 10px}
.me strong{display:block;font-weight:600}
.side-foot .nav-i{width:100%;border:0;background:none;font:inherit;cursor:pointer}
.main{padding:28px 32px 80px;max-width:1240px;width:100%}
.topbar{display:none}
.scrim{display:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h p{margin-top:4px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}
.stack>*+*{margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.alert{border-radius:var(--r);padding:14px 16px;margin-bottom:16px;border:1px solid}
.alert.bad{background:#2a1416;border-color:#5a2328}
.alert.warn{background:#2a2110;border-color:#4d3a14}
.alert-h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.alert.bad .alert-h{color:#ff8a8a}.alert.warn .alert-h{color:#f7cf86}
.alert ul{margin:0;padding:0;list-style:none}
.alert li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.alert li:first-child{border-top:0}
.alert a{text-decoration:none}
.empty{color:var(--muted);padding:18px 0;text-align:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:rgba(62,207,142,.12)}
.s-faulty{color:var(--bad);background:rgba(255,93,93,.13)}
.s-in-repair{color:var(--warn);background:rgba(245,165,36,.13)}
.s-out-of-service{color:#ff8a5d;background:rgba(255,138,93,.13)}
.s-retired{color:var(--grey);background:rgba(107,115,133,.15)}
.s-away{color:var(--info);background:rgba(90,169,255,.13)}
.chk td{padding:8px 6px}.chk td:last-child{text-align:right;white-space:nowrap}
.seg{display:inline-flex;gap:4px}.seg label{margin:0;cursor:pointer}.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-block;padding:6px 11px;border-radius:7px;border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--muted);min-width:44px;text-align:center}
.seg input:checked+.seg-pass{background:rgba(62,207,142,.18);border-color:var(--ok);color:var(--ok)}
.seg input:checked+.seg-fail{background:rgba(255,93,93,.18);border-color:var(--bad);color:var(--bad)}
.seg input:checked+.seg-na{background:var(--panel2);border-color:#47506a;color:var(--text)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.ci-note{margin-top:8px;padding:7px 10px;min-height:34px;font-size:13px}
.ci-add{display:block;margin:6px 0 0 auto;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.ci-add:hover{color:var(--text)}
.d-overdue{color:var(--bad);background:rgba(255,93,93,.13)}
.d-soon{color:var(--warn);background:rgba(245,165,36,.13)}
.d-ok{color:var(--ok);background:rgba(62,207,142,.12)}
.tag{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent)}

/* tables & lists */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list>li:first-child{border-top:0}
.list a{text-decoration:none}
.filters{display:grid;grid-template-columns:1fr 160px 170px;gap:10px;margin-bottom:14px}
.tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--text)}

/* asset detail */
.a-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.a-head h1 .tag{font-size:22px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px}
.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.kv div b{font-weight:500}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.log{display:grid;grid-template-columns:14px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--grey)}
.k-fault .log-dot{background:var(--bad)}.k-repair .log-dot{background:var(--ok)}.k-service .log-dot{background:var(--info)}.k-inspection .log-dot{background:var(--warn)}
.log-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.log p{margin:5px 0 0;white-space:pre-wrap;color:#c9cdd8}
.meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--panel2);border:1px solid var(--line2);cursor:pointer}

/* scan */
.reader{width:100%;max-width:420px;margin:0 auto 14px;border-radius:12px;overflow:hidden;background:#000;min-height:0}
.reader{position:relative}.reader video{display:block;width:100%;height:auto}
.aim{position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.cam-tools{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:8px;justify-content:center}
.scan-big{display:grid;place-items:center;gap:14px;text-align:center;padding:26px 10px}
.scan-ring{width:110px;height:110px;border-radius:24px;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--accent)}
.scan-ring .ic{width:46px;height:46px}
.lookup{display:flex;gap:8px;max-width:520px;margin:0 auto}
.lookup input{font-family:var(--mono)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,9,.7);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.modal.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:20px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.note{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px}
.auth-card .brand{justify-content:center;font-size:22px;padding-bottom:6px}
.auth-card .brand .logo{width:36px;height:36px}
.auth-card .card{padding:22px;margin-top:20px}
.auth-card .tabs{display:flex;margin-bottom:18px}
.auth-card .tabs button{flex:1}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#232836;border:1px solid var(--line2);padding:10px 16px;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-weight:500;animation:tin .2s ease}
.toast.bad{border-color:#5a2328;color:#ff9a9a}.toast.warn{border-color:#4d3a14;color:#f7cf86}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

#print{display:none}

@media (max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.grid2{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .layout{display:block}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .brand{padding:0;font-size:15px}
  .topbar .brand .logo{width:24px;height:24px}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s ease;height:100%}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
  .main{padding:18px 16px 90px}
  .filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}
  .fgrid{grid-template-columns:1fr}
  .hide-m{display:none}
  .fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:25}
  .fab .ic{width:26px;height:26px}
}
@media (min-width:861px){.fab{display:none}}

@media print{
  body{background:#fff;color:#000}
  #app,#modal,#toast{display:none!important}
  #print{display:block;font-family:Inter,Arial,sans-serif;font-size:11pt;color:#000}
  #print h1{font-size:18pt;margin:0 0 4pt}
  #print h2{color:#000;font-size:11pt;margin:16pt 0 6pt}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border-bottom:1px solid #ccc;padding:5pt 6pt;text-align:left;vertical-align:top;font-size:10pt}
  #print th{background:#f2f2f2}
  #print .sub{color:#555;margin-bottom:10pt}
}
</style>

<div id="modal" class="modal"><div class="modal-box"><div class="modal-h"><h3 id="modal-title"></h3><button class="icon-btn" data-act="modal-close" aria-label="Close"></button></div><div class="modal-b" id="modal-body"></div></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
/* ============================================================
   ChainLog — chain motor inspections, load tests & maintenance
   ============================================================ */
const CFG = Object.assign({ SUPABASE_URL:'', SUPABASE_ANON_KEY:'', APP_NAME:'ChainLog', FAULT_ALERT_DAYS:60, DUE_SOON_DAYS:14, INSPECTION_DAYS:182, LOADTEST_DAYS:365 }, window.CHAINLOG_CONFIG || {});
const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY;
const BUILD = '2026-10-30.3';   // bump together with version.json on every release
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

const BAD = ['Faulty','In repair','Out of service'];
const STATUSES = ['OK','Faulty','In repair','Out of service','Retired'];
const CATS = ['Chain motor','Controller','Other'];
const KINDS = ['Fault','Repair','Service','Inspection','Note'];
const DAY = 864e5;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').trim().toLowerCase();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
/* formatters are built once and reused (building one per date is slow on phones) */
const F_DATE = new Intl.DateTimeFormat(undefined, {day:'numeric', month:'short', year:'numeric'});
const F_DT = new Intl.DateTimeFormat(undefined, {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'});
const F_NUM = new Intl.NumberFormat();
const F_SORT = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
const fmtDate = d => d ? F_DATE.format(new Date(d)) : '—';
const fmtDT = d => d ? F_DT.format(new Date(d)) : '—';
const daysSince = d => Math.floor((Date.now() - new Date(d)) / DAY);
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-');
const pill = st => `<span class="pill s-${slug(st)}">${h(st)}</span>`;
const isAdmin = () => S.profile?.role === 'admin';
const assetById = id => S.assets.find(a => a.id === id);
const nameOf = id => S.profiles.find(p => p.id === id)?.name || 'Unknown';
const whoOf = l => l.tech_name || nameOf(l.created_by);
const hasH = v => v != null && v !== '';
const fmtH = v => hasH(v) ? F_NUM.format(Number(v)) + ' h' : '—';
const numOrNull = v => (v == null || String(v).trim() === '') ? null : Number(v);
const byNewest = (a, b) => new Date(b.created_at) - new Date(a.created_at);

const P = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/>',
  box:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  hook:'<path d="M12 2v6"/><circle cx="12" cy="4" r="1.5"/><path d="M12 8a5 5 0 1 0 5 5"/><path d="M17 13l-2-2"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>',
  chart:'<path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/>',
  parts:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5.2-5-5.8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
  print:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>', edit:'<path d="M4 20h4L20 8l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>',

async function compressImage(file, max) {
  max = max || (DEMO ? 900 : 1600);
  if (!file.type.startsWith('image/')) return file;
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);

    return blob || file;

function supabaseApi() {

    async session() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
    async signUp(name, email, password) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw error; return data;
    },
    async resetPw(email) { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] }); if (error) throw error; },
    async setPw(password) { const { error } = await sb.auth.updateUser({ password }); if (error) throw error; },
    async signOut() { clearCaches(); await sb.auth.signOut(); },
    async profile(id) { const { data, error } = await sb.from('profiles').select('*').eq('id', id).maybeSingle(); if (error) throw error; return data; },
    async all(table) {
      let out = [], from = 0;
      for (;;) {
        const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: false }).range(from, from + 999);
        if (error) throw error;
        out = out.concat(data); if (data.length < 1000) break; from += 1000;
      }
      return out;
    },
    async insert(table, row) { const { data, error } = await sb.from(table).insert(row).select().single(); if (error) throw friendly(error); return data; },
    async update(table, id, patch) { const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single(); if (error) throw friendly(error); return data; },
    async remove(table, id) { const { error } = await sb.from(table).delete().eq('id', id); if (error) throw friendly(error); },
    async upload(bucket, blob, name) {
      const path = `${new Date().toISOString().slice(0,10)}/${uid().slice(0,8)}-${String(name || 'file').replace(/[^\w.\-]+/g, '_')}`;
      const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: blob.type || undefined });
      if (error) throw error; return path;
    },
    async fileUrl(bucket, path) { const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600); if (error) throw error; return data.signedUrl; },
  };
  function friendly(e) {
    if (e.code === '23505') return new Error('An item with that asset tag already exists.');
    if (e.code === '42501') return new Error("You don't have permission to do that.");
    if (e.code === '23514' || /Not enough in stock/i.test(e.message || '')) return new Error('Not enough in stock for that.');
    return e;
  }
}

/* ---------- saved copy on this device: instant open + offline viewing ---------- */
const SYNC_TABLES = ['assets', 'logs', 'inspections', 'manuals', 'profiles', 'parts', 'part_moves'];
const cacheKey = id => 'cl-data-v1:' + id;
let saveTimer = 0;
function saveCache() {
  if (DEMO || !S.user || !S.profile || S.profile.role === 'pending') return;
  try {
    const d = { at: S.lastSync || Date.now(), profile: S.profile, partsMissing: S.partsMissing, repairsMissing: S.repairsMissing };
    for (const t of SYNC_TABLES) d[t] = S[t];
    localStorage.setItem(cacheKey(S.user.id), JSON.stringify(d));
  } catch {}
}
const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveCache, 1500); };
function readCache(id) { try { return JSON.parse(localStorage.getItem(cacheKey(id)) || 'null'); } catch { return null; } }
function clearCaches() { try { for (const k of Object.keys(localStorage)) if (k.startsWith('cl-data-')) localStorage.removeItem(k); } catch {} }

async function boot() {
  try { S.user = await api.session(); } catch { S.user = null; }
  const c = S.user && !DEMO ? readCache(S.user.id) : null;
  if (c && c.profile && c.profile.role !== 'pending') {          // show the saved copy straight away…
    for (const t of SYNC_TABLES) S[t] = c[t] || [];
    Object.assign(S, { profile: c.profile, partsMissing: !!c.partsMissing, repairsMissing: !!c.repairsMissing, lastSync: c.at, booted: true });
    render();
    sync(true);                                                 // …then freshen it in the background
    return;
  }
  try {
    S.profile = S.user ? await api.profile(S.user.id) : null;
    if (S.profile && S.profile.role !== 'pending') { await loadAll(); S.lastSync = Date.now(); S.offline = false; saveCache(); }

}
async function sync(quiet) {

  S.syncing = true;
  try {
    const prof = await api.profile(S.user.id);
    if (!prof || prof.role === 'pending') { clearCaches(); S.profile = prof; for (const t of SYNC_TABLES) S[t] = []; render(); return; }   // access removed → wipe
    S.profile = prof;
    await loadAll();

let IDX = null;
function idx() {
  if (IDX) return IDX;

  for (const i of S.inspections) { let a = insp.get(i.asset_id); if (!a) insp.set(i.asset_id, a = []); a.push(i); }
  for (const a of insp.values()) a.sort((x, y) => String(y.inspected_on).localeCompare(String(x.inspected_on)) || byNewest(x, y));
  for (const j of S.repair_jobs) { let a = jobs.get(j.asset_id); if (!a) jobs.set(j.asset_id, a = []); a.push(j); }
  for (const a of jobs.values()) a.sort((x, y) => String(y.sent_at).localeCompare(String(x.sent_at)));
  for (const l of S.logs) { let a = logs.get(l.asset_id); if (!a) logs.set(l.asset_id, a = []); a.push(l); }
  for (const a of logs.values()) a.sort(byNewest);
  for (const m of S.part_moves) { if (!m.asset_id) continue; let a = moves.get(m.asset_id); if (!a) moves.set(m.asset_id, a = []); a.push(m); }
  for (const a of S.assets) { if (a.status === 'Retired') continue; const k = norm(a.make) + '|' + norm(a.model); let x = byModel.get(k); if (!x) byModel.set(k, x = []); x.push(a); }
  return IDX = { logs, moves, byModel, jobs, insp, due: null, dueI: null };
}
const logsFor = id => idx().logs.get(id) || [];
const movesFor = id => idx().moves.get(id) || [];
function scheduleTargets(s) {
  if (s.asset_id) { const a = assetById(s.asset_id); return a && a.status !== 'Retired' ? [a] : []; }
  return idx().byModel.get(norm(s.make) + '|' + norm(s.model)) || [];
}
function dueFor(s, a) {
  const last = logsFor(a.id).find(l => l.schedule_id === s.id);
  const base = last ? last.created_at : a.created_at;
  let state = 'ok', dueDate = null, daysLeft = null, hoursLeft = null;
  if (s.interval_days) {
    dueDate = new Date(new Date(base).getTime() + s.interval_days * DAY);
    daysLeft = Math.ceil((dueDate - Date.now()) / DAY);
    state = daysLeft < 0 ? 'overdue' : daysLeft <= CFG.DUE_SOON_DAYS ? 'soon' : 'ok';
  }
  const basis = s.hours_basis === 'fixture' ? 'fixture_hours' : 'lamp_hours';
  if (s.interval_hours && hasH(a[basis])) {
    const lastH = last && hasH(last[basis]) ? Number(last[basis]) : 0;
    hoursLeft = Math.round(lastH + Number(s.interval_hours) - Number(a[basis]));
    if (hoursLeft <= 0) state = 'overdue';
    else if (hoursLeft <= s.interval_hours * 0.1 && state === 'ok') state = 'soon';

  return { s, a, last, dueDate, daysLeft, hoursLeft, state };
}
function dueList() {
  if (idx().due) return idx().due;
  const out = []; const rank = { overdue:0, soon:1, ok:2 };
  for (const s of S.schedules) for (const a of scheduleTargets(s)) out.push(dueFor(s, a));
  const key = d => d.daysLeft ?? d.hoursLeft ?? 1e9;

}

  if (d.daysLeft != null) p.push(d.daysLeft < 0 ? `${-d.daysLeft} days overdue` : d.daysLeft === 0 ? 'due today' : `due in ${d.daysLeft} days`);
  const hl = d.s.hours_basis === 'fixture' ? 'fixture' : 'lamp';
  if (d.hoursLeft != null) p.push(d.hoursLeft <= 0 ? `${-d.hoursLeft} ${hl} h over` : `${d.hoursLeft} ${hl} h left`);
  return p.join(' · ') || '—';
}

let qr = null;   /* live scanner state: { stream, track, video, timer, n } */
function camProblem(e) {
  const s = (e?.name || '') + ' ' + errMsg(e);
  if (/NotAllowed|Permission|denied/i.test(s)) return 'Camera access is blocked for this site. Allow the camera in your browser settings (iPhone: Settings → Safari → Camera → Allow), then try again — or use "Take a photo".';
  if (/NotFound|no camera|Requested device not found|Overconstrained/i.test(s)) return 'No camera found on this device. Use "Take a photo" or type the code.';
  if (/NotReadable|in use|Could not start/i.test(s)) return 'The camera is busy in another app. Close it and try again, or use "Take a photo".';
  return 'The live camera couldn\'t start (' + s.trim() + '). Use "Take a photo" instead.';
}
function showCamMsg(msg) { const el = $('#cam-msg'); if (el) { el.textContent = msg; el.hidden = !msg; } }

/* Decoder: jsQR, trying normal AND inverted codes (your stickers are white-on-black). */
const scanCanvas = document.createElement('canvas');
const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
/* Glare/low-contrast rescue: local-average threshold, so a washed-out patch of a shiny label still separates. */
/* [radius px at 640, offset, invert]: tuned on real white-on-black Powa stickers (X-Frame 055, Strike-M 012) */
const CLEANUP = [[16, 8, 1], [12, 8, 1], [24, 12, 1], [16, 12, 1], [12, 12, 1], [32, 16, 1], [24, 8, 1], [16, 8, 0], [8, 4, 1], [12, 4, 0]];
function cleanupDecode(px, w, hh, [rp, c, inv]) {
  const n = w * hh, g = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = .299 * px[i * 4] + .587 * px[i * 4 + 1] + .114 * px[i * 4 + 2];
  const W1 = w + 1, I = new Float64Array(W1 * (hh + 1));
  for (let y = 0; y < hh; y++) { let row = 0; for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row; } }
  const r = Math.max(3, Math.round(rp * Math.min(w, hh) / 640)), out = new Uint8ClampedArray(n * 4);
  for (let y = 0; y < hh; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(hh, y + r + 1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
      const m = (I[y1 * W1 + x1] - I[y0 * W1 + x1] - I[y1 * W1 + x0] + I[y0 * W1 + x0]) / ((x1 - x0) * (y1 - y0));
      const v = ((g[y * w + x] > m + c) !== !!inv) ? 255 : 0, j = (y * w + x) * 4;   // invert: bright modules → black
      out[j] = out[j + 1] = out[j + 2] = v; out[j + 3] = 255;
    }
  }
  const res = window.jsQR(out, w, hh, { inversionAttempts: 'dontInvert' });
  return res && res.data ? res.data.trim() : null;
}
/* passes: 'plain' = normal + inverted; a number = one cleanup recipe; 'all' = plain then every recipe */
function decodeRegion(src, sx, sy, sw, sh, maxSide, passes = 'plain') {
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * k)), hh = Math.max(1, Math.round(sh * k));
  scanCanvas.width = w; scanCanvas.height = hh;
  scanCtx.drawImage(src, sx, sy, sw, sh, 0, 0, w, hh);
  const px = scanCtx.getImageData(0, 0, w, hh).data;
  if (passes === 'plain' || passes === 'all') {
    const r = window.jsQR(px, w, hh, { inversionAttempts: 'attemptBoth' });
    if (r && r.data) return r.data.trim();
  }
  const recipes = passes === 'all' ? CLEANUP : typeof passes === 'number' ? [CLEANUP[passes % CLEANUP.length]] : [];
  for (const rc of recipes) { const t = cleanupDecode(px, w, hh, rc); if (t) return t; }
  return null;
}

async function camStart() {
  showCamMsg('');
  if (!window.jsQR) return showCamMsg('The scanner didn\'t load. Reload the page and try again.');
  if (!isSecureContext) return showCamMsg('The camera only works when the app is opened from its https:// web address.');
  if (!navigator.mediaDevices?.getUserMedia) return showCamMsg('This browser can\'t use the live camera (some in-app browsers block it). Open the link in Safari or Chrome, or use "Take a photo".');
  await camStop();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) { return showCamMsg(camProblem(e)); }
  const box = $('#reader'); if (!box) { stream.getTracks().forEach(t => t.stop()); return; }
  box.innerHTML = `<video playsinline muted autoplay></video><div class="aim"></div><div class="cam-tools" id="cam-tools"></div>`;
  const video = box.querySelector('video'); video.srcObject = stream;
  $('#scan-idle').hidden = true; $('#cam-stop').hidden = false; box.hidden = false;
  const track = stream.getVideoTracks()[0];
  qr = { stream, track, video, timer: 0, n: 0, zoom: 1 };
  try { await video.play(); } catch {}
  try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
  camTools();
  showCamMsg('');
  const tick = () => {
    if (!qr || qr.video !== video) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const vw = video.videoWidth, vh = video.videoHeight; qr.n++;
      if (qr.n === 1) { const aim = $('#reader .aim'); if (aim) aim.style.width = (75 * Math.min(vw, vh) / vw) + '%'; }
      let txt = null;
      try {
        const side = Math.round(Math.min(vw, vh) * 0.75);                       // the aiming square, full detail
        const sq = [(vw - side) / 2, (vh - side) / 2, side, side];
        txt = decodeRegion(video, ...sq, 900);
        if (!txt) txt = decodeRegion(video, ...sq, 640, qr.n);                     // glare clean-up, a different recipe each frame
        if (!txt && qr.n % 3 === 0) txt = decodeRegion(video, 0, 0, vw, vh, 1280);   // whole picture now and then
      } catch {}
      if (txt) { if (navigator.vibrate) navigator.vibrate(60); camStop(); lookup(txt); return; }
      if (qr.n === 40) showCamMsg('Not picking it up? Move closer so the sticker fills the square, hold steady, and turn on the light if it\'s dark.');
    }
    qr.timer = setTimeout(tick, 120);
  };
  tick();
}
function camTools() {
  const el = $('#cam-tools'); if (!el || !qr) return;
  let caps = {}; try { caps = qr.track.getCapabilities?.() || {}; } catch {}
  const btns = [];
  if (caps.torch) btns.push(`<button type="button" class="btn sm" data-act="cam-torch">💡 Light</button>`);
  if (caps.zoom && caps.zoom.max >= 2) btns.push(`<button type="button" class="btn sm" data-act="cam-zoom">🔍 Zoom ${qr.zoom > 1 ? '1×' : '2×'}</button>`);
  el.innerHTML = btns.join('');
}
async function camTorch() {
  if (!qr) return; qr.torch = !qr.torch;
  try { await qr.track.applyConstraints({ advanced: [{ torch: qr.torch }] }); } catch { toast('Light not available on this camera', 'warn'); }
}
async function camZoom() {
  if (!qr) return; const caps = qr.track.getCapabilities?.() || {};
  qr.zoom = qr.zoom > 1 ? Math.max(1, caps.zoom?.min || 1) : Math.min(2, caps.zoom?.max || 2);
  try { await qr.track.applyConstraints({ advanced: [{ zoom: qr.zoom }] }); } catch {}
  camTools();
}
async function camStop() {
  if (!qr) return; const q = qr; qr = null;
  clearTimeout(q.timer);
  try { q.stream.getTracks().forEach(t => t.stop()); } catch {}
  const box = $('#reader'); if (box) { box.innerHTML = ''; box.hidden = true; }
  const idle = $('#scan-idle'); if (idle) { idle.hidden = false; $('#cam-stop').hidden = true; }
}
async function scanPhoto(input) {
  const file = input.files?.[0]; input.value = ''; if (!file) return;
  if (!window.jsQR) return showCamMsg('The scanner didn\'t load. Reload the page and try again.');
  showCamMsg('Reading code…');
  await new Promise(r => setTimeout(r, 30));
  let img;
  try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { try { img = await createImageBitmap(file); } catch { return showCamMsg('Couldn\'t open that photo.'); } }
  const W = img.width, H = img.height, m = Math.min(W, H);
  const tries = [
    [0, 0, W, H, 1600],                                   // whole photo
    [(W - m * .6) / 2, (H - m * .6) / 2, m * .6, m * .6, 1200],   // centre
    [0, 0, W, H, 2600],                                   // whole photo, more detail
  ];
  for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 3; gx++) tries.push([gx * W / 4, gy * H / 4, W / 2, H / 2, 1200]);  // overlapping quarters
  let txt = null;

    try { txt = decodeRegion(img, x, y, w, hh, 640, 'all'); } catch {} if (txt) break; await new Promise(r => setTimeout(r, 0));

}
function lookup(raw, fromRoute) {
  let code = String(raw || '').trim();
  const m = code.match(/#\/tag\/(.+)$/); if (m) code = decodeURIComponent(m[1]);
  if (!code) return;
  const k = codeKey(code);
  const a = S.assets.find(x => norm(x.tag) === norm(code)) || S.assets.find(x => x.serial && norm(x.serial) === norm(code))
    || S.assets.find(x => codeKey(x.tag) === k) || S.assets.find(x => x.serial && codeKey(x.serial) === k);
  if (a) {
    const to = '#/asset/' + a.id; beep(true);
    fromRoute ? location.replace(to) : (location.hash = to);
    if (!fromRoute && S.afterScan === 'inspect') setTimeout(() => inspModal(a.id), 60);
    else if (!fromRoute && S.afterScan !== 'open') setTimeout(() => logModal(a.id, S.afterScan === 'fault' ? { kind: 'Fault' } : {}), 60);
    return;
  }
  beep(false);

}
/* Codes match ignoring case, spaces, dashes and leading zeros: "XFRAME-055" = "X-Frame 55" */
function codeKey(s) {

async function linkCode(f) {
  const fd = new FormData(f); const code = fd.get('code'), t = fd.get('tag');
  const a = S.assets.find(x => norm(x.tag) === norm(t)) || S.assets.find(x => x.serial && norm(x.serial) === norm(t)) || S.assets.find(x => codeKey(x.tag) === codeKey(t));
  if (!a) throw new Error('No motor with that tag or serial.');

  S.logs.unshift(await api.insert('logs', { asset_id: a.id, kind: 'Note', title: `QR code linked: ${code}`, details: `Tag changed from ${old}`, photos: [], created_by: S.user.id }));

}

async function submitPart(f) {
  const fd = Object.fromEntries(new FormData(f)); const id = fd.id;
  const row = { name: fd.name.trim(), make: fd.make.trim(), fits: fd.fits.trim(), supplier_code: fd.supplier_code.trim(), part_number: fd.part_number.trim(),

  const qty = parseInt(fd.quantity || '0', 10) || 0;
  let pt;
  if (id) {

    if (qty !== pt.quantity) { const m = await api.insert('part_moves', { part_id: id, change: qty - pt.quantity, kind: 'adjust', notes: 'Stock count corrected', created_by: S.user.id }); S.part_moves.unshift(m); pt.quantity = qty; }
  } else {
    pt = await api.insert('parts', { ...row, quantity: 0 }); S.parts.push(pt);

  }
  toast(id ? 'Saved' : 'Part added'); closeModal(); location.hash = '#/part/' + pt.id; render();
}

/* ---------- repairs sent away (ShowTech etc.) ---------- */
const REPAIR_OVERDUE_DAYS = CFG.REPAIR_OVERDUE_DAYS || 30;   // flag when no expected-back date and away longer than this
const jobsFor = id => idx().jobs.get(id) || [];
const openJob = id => jobsFor(id).find(j => !j.returned_at);
const openJobs = () => S.repair_jobs.filter(j => !j.returned_at && assetById(j.asset_id));
const isoDay = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const daysAway = j => Math.max(0, Math.floor((Date.now() - new Date(j.sent_at + 'T00:00:00')) / DAY));
function jobOverdue(j) {
  if (j.returned_at) return false;
  if (j.expected_back) return isoDay() > j.expected_back;
  return daysAway(j) > REPAIR_OVERDUE_DAYS;
}
const fmtDay = d => d ? fmtDate(d + 'T12:00:00') : '—';
function apill(a) {
  const j = S.repairsMissing ? null : openJob(a.id);
  return j ? `<span class="pill s-away" title="${h(a.status)}">At ${h(j.repairer)}${jobOverdue(j) ? ' · overdue' : ''}</span>` : pill(a.status);
}
const repairers = () => uniq(['ShowTech', ...S.repair_jobs.map(j => j.repairer)]);

}

async function submitSend(f) {
  const fd = new FormData(f); const a = assetById(fd.get('asset_id'));
  if (openJob(a.id)) throw new Error('This light is already away for repair.');
  const repairer = fd.get('repairer').trim(), job_no = fd.get('job_no').trim(), fault = fd.get('fault').trim();
  if (!repairer || !fault) throw new Error('Fill in where it went and the fault.');
  const job = await api.insert('repair_jobs', { asset_id: a.id, repairer, job_no: job_no || null, fault, sent_at: fd.get('sent_at'), expected_back: fd.get('expected_back') || null, notes: fd.get('notes').trim() || null, created_by: S.user.id });
  S.repair_jobs.unshift(job);
  const patch = { location: repairer, updated_at: new Date().toISOString(), updated_by: S.user.id };
  if (!BAD.includes(a.status)) Object.assign(patch, statusPatch(a, 'In repair'));
  else if (a.status === 'Faulty') patch.status = 'In repair';
  Object.assign(a, await api.update('assets', a.id, patch));
  S.logs.unshift(await api.insert('logs', { asset_id: a.id, kind: 'Note', title: `Sent to ${repairer}${job_no ? ' (job ' + job_no + ')' : ''}`, details: fault + (job.expected_back ? `\nExpected back ${fmtDay(job.expected_back)}` : ''), location: repairer, photos: [], status_after: a.status, created_by: S.user.id }));
  toast(`${a.tag} sent to ${repairer}`); closeModal(); render();
}

  Object.assign(j, await api.update('repair_jobs', j.id, { returned_at: fd.get('returned_at'), outcome, cost, notes: [j.notes, notes].filter(Boolean).join('\n') }));

  Object.assign(a, await api.update('assets', a.id, { ...statusPatch(a, st), location, updated_at: new Date().toISOString(), updated_by: S.user.id }));
  S.logs.unshift(await api.insert('logs', { asset_id: a.id, kind: outcome === 'Fixed' ? 'Repair' : outcome === 'Still faulty' ? 'Fault' : 'Note',

}

/* ---------- repair cost per light ---------- */
function costOf(a) {
  let parts = 0, partsQty = 0, unpriced = 0;
  for (const m of movesFor(a.id)) {
    if (m.kind !== 'checkout' && m.kind !== 'return') continue;
    const price = hasH(m.unit_price) ? Number(m.unit_price) : hasH(partById(m.part_id)?.unit_price) ? Number(partById(m.part_id).unit_price) : null;
    const qty = -m.change;
    partsQty += qty;
    if (price == null) { if (m.kind === 'checkout') unpriced += qty; continue; }
    parts += qty * price;
  }
  const js = jobsFor(a.id), repairs = js.reduce((n, j) => n + (Number(j.cost) || 0), 0);
  const ls = logsFor(a.id), faults = ls.filter(l => l.kind === 'Fault').length;
  const faults12 = ls.filter(l => l.kind === 'Fault' && daysSince(l.created_at) <= 365).length;
  return { parts, partsQty, unpriced, repairs, jobs: js.length, total: parts + repairs, faults, faults12 };
}
const PROBLEM_FAULTS = 3;   // faults in 12 months that flag a "problem unit"
function costCard(a) {

  return `<section class="card"><h2>Repair cost</h2><div class="kv" style="grid-template-columns:1fr 1fr">
    <div><span>Parts fitted</span><b>${money(c.parts)}</b><div class="muted small">${c.partsQty} part${c.partsQty === 1 ? '' : 's'}${c.unpriced ? ` · ${c.unpriced} with no price` : ''}</div></div>
    <div><span>Repairer bills</span><b>${money(c.repairs)}</b><div class="muted small">${c.jobs} job${c.jobs === 1 ? '' : 's'}</div></div>
    <div><span>Total spent</span><b>${money(c.total)}</b></div>
    <div><span>Faults logged</span><b>${c.faults}</b><div class="muted small">${c.faults12} in the last 12 months${c.faults12 >= PROBLEM_FAULTS ? ' · <span style="color:var(--bad)">problem unit</span>' : ''}</div></div>
  </div></section>`;
}
let costModel = '';
function costRows() {
  return S.assets.filter(a => !costModel || a.model === costModel).map(a => ({ a, ...costOf(a) }))

function modelCostTable() {
  const by = new Map();
  for (const a of S.assets) {
    if (a.category === 'Other') continue;
    const c = costOf(a), k = a.model || '—';
    const m = by.get(k) || { model: k, units: 0, total: 0, faults12: 0, problems: 0 };
    m.units++; m.total += c.total; m.faults12 += c.faults12; if (c.faults12 >= PROBLEM_FAULTS) m.problems++;

  const rows = [...by.values()].filter(m => m.total || m.faults12).sort((x, y) => y.total - x.total || y.faults12 - x.faults12);

}

  { label: 'Test & Tag', hint: '' },
]).map(c => typeof c === 'string' ? { label: c, hint: '' } : c);
const BRAKE_MIN = CFG.BRAKE_GAP_MIN ?? 0.2, BRAKE_MAX = CFG.BRAKE_GAP_MAX ?? 0.5;
const CHAIN_LENGTHS = CFG.CHAIN_LENGTHS || [10, 15, 20, 25, 30, 40];
const INSP_DAYS = CFG.INSPECTION_DAYS || 182, LOAD_DAYS = CFG.LOADTEST_DAYS || 365;
const KIND_LABEL = { 'Periodic': 'Periodic inspection', 'Load test': 'Load test' };
const isMotor = a => a.category === 'Chain motor' && a.status !== 'Retired';
const inspFor = id => idx().insp.get(id) || [];
const lastPass = (id, kind) => inspFor(id).find(i => i.kind === kind && i.result === 'Pass');
const everyText = days => days % 365 === 0 ? `every ${days / 365 === 1 ? '' : days / 365 + ' '}year${days / 365 === 1 ? '' : 's'}` : days >= 28 ? `every ${Math.round(days / 30.4)} months` : `every ${days} days`;
function dueOf(a, kind) {
  const days = kind === 'Load test' ? LOAD_DAYS : INSP_DAYS, last = lastPass(a.id, kind);
  const latest = inspFor(a.id).find(i => i.kind === kind);
  if (latest && latest.result === 'Fail') return { kind, last, failed: latest, due: null, left: null, state: 'failed' };   // needs a new passing check
  if (!last) return { kind, last: null, due: null, left: null, state: 'never' };
  const due = new Date(new Date(last.inspected_on + 'T12:00:00').getTime() + days * DAY);
  const left = Math.ceil((due - Date.now()) / DAY);
  return { kind, last, due, left, state: left < 0 ? 'overdue' : left <= CFG.DUE_SOON_DAYS ? 'soon' : 'ok' };
}
const dueBad = d => d.state === 'overdue' || d.state === 'never' || d.state === 'failed';
function dueAll() {
  if (idx().dueI) return idx().dueI;
  const out = [];
  for (const a of S.assets) if (isMotor(a)) for (const k of ['Periodic', 'Load test']) out.push({ a, ...dueOf(a, k) });
  const rank = { failed: 0, never: 0, overdue: 0, soon: 1, ok: 2 };
  return idx().dueI = out.sort((x, y) => rank[x.state] - rank[y.state] || (x.left ?? -1e9) - (y.left ?? -1e9) || F_SORT.compare(x.a.tag, y.a.tag));
}
const motorsOverdue = () => [...new Set(dueAll().filter(dueBad).map(d => d.a))];

const inspPill = d => d.state === 'failed' ? '<span class="pill d-overdue">Failed</span>' : d.state === 'never' ? '<span class="pill d-overdue">Not on record</span>' : d.state === 'overdue' ? '<span class="pill d-overdue">Overdue</span>' : d.state === 'soon' ? '<span class="pill d-soon">Due soon</span>' : '<span class="pill d-ok">OK</span>';
const dueTextI = d => d.state === 'failed' ? `Failed ${fmtDate(d.failed.inspected_on + 'T12:00:00')} — needs a new passing ${d.kind === 'Load test' ? 'load test' : 'inspection'}` : d.state === 'never' ? 'No passed ' + (d.kind === 'Load test' ? 'load test' : 'inspection') + ' on record' : d.left < 0 ? `${-d.left} days overdue (was due ${fmtDate(d.due)})` : `due ${fmtDate(d.due)} · ${d.left} days`;
const openFlag = id => inspFor(id).find(i => i.flagged && !i.flag_resolved_at);

function inspectionCard(a) {

function inspCheck(f) {
  const fd = new FormData(f), kind = fd.get('kind');
  const names = kind === 'Load test' ? ['lt_held', 'lt_brake', 'lt_noise'] : [...CHECKLIST.map((_, i) => 'c' + i), 'service_label'];
  const missing = names.filter(n => !fd.get(n)).length + (kind === 'Periodic' && fd.get('brake_gap_mm') === '' ? 1 : 0);
  const failNames = kind === 'Load test' ? names.filter(n => fd.get(n) === 'fail') : CHECKLIST.map((c, i) => !c.yesno && fd.get('c' + i) === 'fail' ? 'c' + i : null).filter(Boolean);
  const g = numOrNull(fd.get('gauge_mm')), lim = numOrNull(fd.get('gauge_max_mm')), gap = numOrNull(fd.get('brake_gap_mm'));
  const worn = kind === 'Periodic' && g != null && lim != null && g > lim;
  const gapBad = kind === 'Periodic' && gap != null && (gap < BRAKE_MIN || gap > BRAKE_MAX);
  const forced = kind === 'Periodic' && fd.get('result_override') === 'Fail';
  return { kind, missing, fails: failNames.length, failNames, worn, gapBad, gap, forced, g, lim, fd, names };
}
function inspResult() {
  const f = $('form[data-insp]'), el = $('#insp-result'); if (!f || !el) return;
  const c = inspCheck(f);
  const why = [c.fails ? c.fails + ' item' + (c.fails > 1 ? 's' : '') + ' failed' : '', c.gapBad ? `brake gap ${c.gap} mm is outside ${BRAKE_MIN}–${BRAKE_MAX} mm` : '', c.worn ? `chain worn past limit (${c.g} > ${c.lim} mm)` : '', c.forced ? 'marked as fail' : ''].filter(Boolean);
  if (why.length) { el.style.color = 'var(--bad)'; el.innerHTML = `<b>FAIL</b> — ${h(why.join(', '))}. The motor will be tagged <b>Out of service</b>.`; }
  else if (c.missing) { el.style.color = ''; el.textContent = `${c.missing} item${c.missing > 1 ? 's' : ''} still to fill in.`; }
  else { el.style.color = 'var(--ok)'; el.innerHTML = '<b>PASS</b>'; }
  // a failed item needs a comment: open its note box
  if (c.kind === 'Periodic') CHECKLIST.forEach((it, i) => { const n = f.querySelector(`[name=n${i}]`); if (!n) return; const isFail = !it.yesno && c.fd.get('c' + i) === 'fail'; n.required = isFail; if (isFail || n.value) n.hidden = false; });
}
async function submitInspect(f) {
  const a = assetById(inspAid), c = inspCheck(f), fd = c.fd;
  if (c.missing) throw new Error(`Fill in every item (${c.missing} left).`);
  const notes = fd.get('notes').trim(), who = fd.get('inspector_name').trim();
  if (!who) throw new Error('Who did the inspection?');
  if (c.kind === 'Load test' && !notes) throw new Error('Add notes for the load test.');
  if (c.forced && !c.fails && !c.gapBad && !c.worn && !notes) throw new Error('Say why it fails in General comments.');
  const flagged = c.kind === 'Periodic' && !!fd.get('flagged');
  if (flagged && !fd.get('flag_note').trim()) throw new Error('Add a comment for the flag.');
  let checklist, item_notes = {};
  if (c.kind === 'Load test') checklist = { 'Held the test load': fd.get('lt_held'), 'Brake & limits under load': fd.get('lt_brake'), 'No abnormal noise/heat': fd.get('lt_noise') };
  else {
    checklist = {};
    CHECKLIST.forEach((it, i) => { checklist[it.label] = fd.get('c' + i); const n = (fd.get('n' + i) || '').trim(); if (n) item_notes[it.label] = n; });
    const missingNote = CHECKLIST.find((it, i) => !it.yesno && fd.get('c' + i) === 'fail' && !(fd.get('n' + i) || '').trim());
    if (missingNote) throw new Error(`Add a comment for "${missingNote.label}".`);
    if (flagged) item_notes.__flag = fd.get('flag_note').trim();
  }
  const result = c.fails || c.worn || c.gapBad || c.forced ? 'Fail' : 'Pass';
  const photos = [];
  for (const file of [...f.querySelector('[name=photos]').files]) { const blob = await compressImage(file); photos.push(await api.upload('photos', blob, (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg')); }
  const P = c.kind === 'Periodic', chainLen = P ? numOrNull(fd.get('chain_length_m')) : null;
  const row = { asset_id: a.id, kind: c.kind, inspected_on: fd.get('inspected_on'), checklist, item_notes, result, notes, photos, inspector_name: who, created_by: S.user.id,
    gauge_mm: P ? c.g : null, gauge_max_mm: P ? c.lim : null, brake_gap_mm: P ? c.gap : null, roadcase: P ? (fd.get('roadcase').trim() || null) : null,
    flagged, refer_to: flagged ? (fd.get('refer_to').trim() || null) : null, service_label: P ? fd.get('service_label') === 'pass' : null, chain_length_m: chainLen,
    test_load_kg: c.kind === 'Load test' ? numOrNull(fd.get('test_load_kg')) : null, held: c.kind === 'Load test' ? fd.get('lt_held') === 'pass' : null };
  const ins = await api.insert('inspections', row); S.inspections.unshift(ins);
  const apatch = {};
  if (P && c.lim != null && !hasH(a.gauge_max_mm)) {               // remember the wear limit
    const targets = fd.get('save_limit') ? S.assets.filter(x => x.id !== a.id && norm(x.make) === norm(a.make) && norm(x.model) === norm(a.model) && !hasH(x.gauge_max_mm)) : [];
    for (const x of targets) Object.assign(x, await api.update('assets', x.id, { gauge_max_mm: c.lim, updated_by: S.user.id }));
    apatch.gauge_max_mm = c.lim;
  }
  if (chainLen != null && chainLen !== Number(a.chain_length_m)) apatch.chain_length_m = chainLen;
  const failed = Object.entries(checklist).filter(([k, v]) => v === 'fail' && !CHECKLIST.find(x => x.label === k)?.yesno).map(([k]) => k + (item_notes[k] ? ` (${item_notes[k]})` : ''));
  const noBag = P && checklist['Weather bag'] === 'fail';
  const details = [failed.length ? 'Failed: ' + failed.join('; ') : '', c.gapBad ? `Brake gap ${c.gap} mm — outside ${BRAKE_MIN}–${BRAKE_MAX} mm` : P ? `Brake gap ${c.gap} mm` : '',
    c.worn ? `Chain worn: ${c.g} mm over ${a.gauge_links || 11} links (limit ${c.lim} mm)` : c.g != null ? `Chain: ${c.g} mm${c.lim != null ? ' (limit ' + c.lim + ')' : ''}` : '',
    row.roadcase ? 'Roadcase: ' + row.roadcase : '', noBag ? 'No weather bag in case' : '', P && !row.service_label ? 'Service label NOT applied' : '',
    flagged ? `⚑ Flagged${row.refer_to ? ' → ' + row.refer_to : ''}: ${item_notes.__flag}` : '', row.test_load_kg ? `Test load ${F_NUM.format(row.test_load_kg)} kg` : '', notes].filter(Boolean).join('\n');
  let st = a.status;
  if (result === 'Fail' && a.status !== 'Out of service') { st = 'Out of service'; Object.assign(apatch, statusPatch(a, st)); }
  if (Object.keys(apatch).length) Object.assign(a, await api.update('assets', a.id, { ...apatch, updated_at: new Date().toISOString(), updated_by: S.user.id }));
  S.logs.unshift(await api.insert('logs', { asset_id: a.id, kind: 'Inspection', title: `${KIND_LABEL[c.kind]}: ${result.toUpperCase()}${flagged ? ' ⚑' : ''}`, details, inspection_id: ins.id, location: a.location || '', photos, status_after: result === 'Fail' ? st : null, created_by: S.user.id }));
  if (result === 'Fail') { beep(false); toast(`${a.tag} FAILED — tagged out of service`, 'bad'); }
  else { beep(true); toast(`${a.tag} passed${flagged ? ' — flagged for follow-up' : ''}${a.status !== 'OK' ? ' — status is still ' + a.status + '; log a repair to return it to service' : ''}`); }
  closeModal(); render();
}

async function submitAsset(f) {

  ${rows.map(i => { const a = assetById(i.asset_id); return `<tr><td>${h(i.inspected_on)}</td><td>${h(a.tag)}</td><td>${h(a.serial || '')}</td><td>${hasH(a.wll_kg) ? F_NUM.format(a.wll_kg) + ' kg' : ''}</td><td>${h(KIND_LABEL[i.kind])}</td><td><b>${h(i.result)}</b></td><td>${h(i.inspector_name || '')}</td><td>${hasH(i.gauge_mm) ? i.gauge_mm + ' mm' : ''}</td><td>${hasH(i.test_load_kg) ? F_NUM.format(i.test_load_kg) + ' kg' : ''}</td><td>${h(Object.entries(i.checklist || {}).filter(([, v]) => v === 'fail').map(([k]) => k.split(' (')[0]).join('; '))}</td></tr>`; }).join('') || '<tr><td colspan="10">None recorded</td></tr>'}
  </tbody></table>`);
}
function printFaults() {

/* ---------- USB / Bluetooth scanner guns (they 'type' fast and finish with Enter or Tab) ---------- */
const gun = { buf: '', first: 0, last: 0 };
function isTyping(el) { return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)); }
document.addEventListener('keydown', e => {
  if (!S.profile || S.profile.role === 'pending' || e.ctrlKey || e.metaKey || e.altKey) return;
  const el = e.target;
  // Scanner ending with Tab inside the Scan box: treat Tab like Enter
  if (e.key === 'Tab' && el.id === 'code-input' && el.value.trim()) { e.preventDefault(); el.form.requestSubmit(); return; }
  if (isTyping(el) || $('#modal.open')) { gun.buf = ''; return; }
  const now = performance.now();
  if (now - gun.last > 80) { gun.buf = ''; gun.first = now; }       // a human-speed gap starts over
  gun.last = now;
  if (e.key === 'Enter' || e.key === 'Tab') {
    const code = gun.buf, fast = code.length >= 3 && (now - gun.first) / code.length < 40;
    gun.buf = '';
    if (fast) { e.preventDefault(); lookup(code); }
    return;
  }
  if (e.key.length === 1) gun.buf += e.key;
});

/* ---------- beep: high = found, low double = not found ---------- */
let audioCtx = null;
function beep(ok) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = ok ? [[1320, 0, .09]] : [[220, 0, .14], [220, .2, .14]];
    for (const [f, at, len] of tones) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + at;
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(ok ? .25 : .12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.start(t); o.stop(t + len + .02);
    }
  } catch {}
}

const FORMS = {

  async lookup(f) { lookup(new FormData(f).get('code')); f.reset(); },

};
document.addEventListener('submit', async e => {
  const f = e.target; const fn = FORMS[f.dataset.form]; if (!fn) return;
  e.preventDefault();
  const btn = f.querySelector('button:not([type=button])'); const label = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try { await fn(f); }
  catch (err) { const box = $('#auth-err'); if (box && f.closest('.auth')) box.textContent = errMsg(err); else toast(errMsg(err), 'bad'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; } }
});
let searchTimer = 0;
document.addEventListener('input', e => {

});
document.addEventListener('change', async e => {

  if (t.dataset.orderQty !== undefined) { order.rows[+t.dataset.orderQty].qty = Math.max(0, parseInt(t.value || '0', 10) || 0); drawOrder(); return; }
  if (t.dataset.orderAdd !== undefined) { if (t.value) { order.rows.push({ pid: t.value, qty: 1, on: true }); drawOrder(); } return; }
  if (t.dataset.afterScan !== undefined) { S.afterScan = t.value; try { localStorage.setItem('cl-after-scan', t.value); } catch {} toast('Saved for this device'); return; }
  if (t.dataset.filter === 'partMake') { S.partMake = t.value; $('#part-list').innerHTML = partTable(); return; }
  if (t.dataset.filter && t.tagName === 'SELECT') { S.filter[t.dataset.filter] = t.value; $('#asset-list').innerHTML = assetTable(); return; }
  if (t.dataset.roleFor) {
    try { const p = await api.update('profiles', t.dataset.roleFor, { role: t.value }); Object.assign(S.profiles.find(x => x.id === p.id), p); toast('Access updated'); render(); }
    catch (err) { toast(errMsg(err), 'bad'); render(); }
  }
  if (t.name === 'kind' && t.closest('[data-form=log]')) {

    f.status_after.value = st;
    $('#sched-field').hidden = !(t.value === 'Service' && f.schedule_id.options.length > 1);

});
/* back to the app: refresh at most once a minute, check for a new version every 5 minutes */
let lastVersionCheck = 0;
async function checkVersion() {
  if (DEMO || S.updateReady || Date.now() - lastVersionCheck < 5 * 60e3) return;
  lastVersionCheck = Date.now();
  try {
    const v = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (v.build && v.build !== BUILD) { S.updateReady = true; if (!$('#modal.open') && !qr) render(); }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.booted) saveCache(); return; }
  checkVersion();
  if (DEMO || !S.profile || S.profile.role === 'pending' || qr) return;
  if (Date.now() - (S.lastSync || 0) > 60e3) sync(true);
});
window.addEventListener('online', () => { if (S.profile && S.profile.role !== 'pending') sync(true); });
window.addEventListener('offline', () => { S.offline = true; if (!$('#modal.open') && !qr) render(); });
setInterval(checkVersion, 30 * 60e3);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
